version: 2

models:
  - name: dim_campaigns
    description: "Promotional Campaign Dimension"
    columns:
      - name: campaign_key
        data_tests:
          - unique
          - not_null

  - name: dim_customers
    description: |
      Customer Dimension.
      Also includes subscribers who are not yet customers
    columns:
      - name: customer_key
        data_tests:
          - unique
          - not_null

  - name: dim_dates
    description: "Date Dimension"
    columns:
      - name: date_key
        data_tests:
          - unique
          - not_null

  - name: dim_emails
    description: "Email Dimension"
    columns:
      - name: email_key
        data_tests:
          - unique
          - not_null

  - name: dim_products
    description: "Product Dimension"
    columns:
      - name: product_key
        data_tests:
          - unique
          - not_null

  - name: fact_email_events
    description: |
      Marketing Email Events Fact.
      The grain of this table is customer + email + event
      Each row represents a discrete event for a single customer on a single email
    columns:
      - name: email_event_key
        data_tests:
          - unique
          - not_null
      - name: event_type
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - CLICK
                  - OPEN
                  - SENT

  - name: fact_sales
    description: |
      Sales Fact.
      Each row represents a discrete line item of a customer order
    columns:
      - name: sales_key
        data_tests:
          - unique
          - not_null
